<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лифт Кз Сервис — Панель руководителя</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: #0d1512;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .phone {
    width: 375px;
    background: linear-gradient(180deg, #0f1e17 0%, #0a1410 100%);
    border-radius: 40px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    border: 2px solid #1c2b23;
  }
  .screen {
    background: #0c1712;
    border-radius: 28px;
    overflow: hidden;
    min-height: 720px;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    padding: 14px 22px 4px;
    color: #dfe8e2;
    font-size: 13px;
    font-weight: 500;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-img {
    height: 38px;
    width: auto;
    display: block;
  }
  .brand-text { color: #eef4f0; font-size: 14px; font-weight: 600; line-height: 1.1; }
  .brand-sub { color: #7ea892; font-size: 10px; letter-spacing: 0.06em; }
  .menu-dot { color: #7ea892; font-size: 20px; }

  .hero { padding: 4px 20px 18px; }
  .hero-label { color: #7ea892; font-size: 12px; margin-bottom: 4px; }
  .hero-title { color: #ffffff; font-size: 20px; font-weight: 600; line-height: 1.3; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 0 20px 18px;
  }
  .stat {
    background: #12211a;
    border: 1px solid #1e352a;
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat-num { color: #ffffff; font-size: 20px; font-weight: 700; }
  .stat-label { color: #8fac9d; font-size: 10.5px; margin-top: 2px; }
  .stat.warn .stat-num { color: #f0b23f; }
  .stat.ok .stat-num { color: #3fb87f; }

  .section-title {
    color: #cfe0d7; font-size: 13px; font-weight: 600;
    padding: 6px 20px 10px; display: flex; justify-content: space-between; align-items: center;
  }
  .section-title span.all { color: #7ea892; font-size: 12px; font-weight: 400; }

  .list { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .row {
    background: #101d17;
    border: 1px solid #1c2e24;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .row-left { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #0c1712;
  }
  .badge.to1 { background: #6fc98f; }
  .badge.to2 { background: #f0c23f; }
  .badge.to3 { background: #f0834f; }
  .row-obj { color: #eef4f0; font-size: 13.5px; font-weight: 500; }
  .row-sub { color: #7ea892; font-size: 11.5px; margin-top: 1px; }
  .row-right { text-align: right; }
  .row-date { color: #eef4f0; font-size: 12.5px; font-weight: 600; }
  .row-tag { font-size: 10px; margin-top: 2px; }
  .row-tag.soon { color: #f0b23f; }
  .row-tag.plan { color: #7ea892; }
  .row-actions { padding: 0 14px 4px; }
  .done-btn {
    background: #17301f;
    border: 1px solid #2c5a3a;
    color: #6fc98f;
    font-size: 10.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    margin-top: 8px;
    cursor: pointer;
  }
  .done-btn:active { background: #1f4028; }
  .done-btn:disabled { opacity: 0.5; cursor: default; }

  .footer {
    display: flex; justify-content: space-around; align-items: center;
    padding: 12px 0 18px; border-top: 1px solid #1c2e24; margin-top: 6px;
  }
  .footer .item { color: #5c7b6c; font-size: 10px; text-align: center; }
  .footer .item.active { color: #3fb87f; }
  .footer .dot {
    width: 20px; height: 20px; margin: 0 auto 3px;
    border-radius: 6px; background: currentColor; opacity: 0.15;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span>●●●● 5G  100%</span></div>

      <div class="topbar">
        <div class="brand">
          <img src="assets/logo.png" alt="Лифт Кз Сервис" class="logo-img">
          <div>
            <div class="brand-text">Лифт Кз Сервис</div>
            <div class="brand-sub">ПАНЕЛЬ РУКОВОДИТЕЛЯ</div>
          </div>
        </div>
        <div class="menu-dot">&#8942;</div>
      </div>

      <div class="hero">
        <div class="hero-label">Парк оборудования</div>
        <div class="hero-title">Все объекты под контролем — одним взглядом</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-num" id="statTotal">350</div>
          <div class="stat-label">Всего в парке</div>
        </div>
        <div class="stat warn">
          <div class="stat-num" id="statWeek">—</div>
          <div class="stat-label">ТО на этой неделе</div>
        </div>
        <div class="stat ok">
          <div class="stat-num" id="statOverdue">—</div>
          <div class="stat-label">Просрочено</div>
        </div>
      </div>

      <div class="section-title">
        Ближайшее обслуживание
        <span class="all">все объекты &rsaquo;</span>
      </div>

      <div class="list" id="objList">
        <div class="row"><div class="row-left"><div class="row-obj">Загрузка...</div></div></div>
      </div>

      <div class="footer">
        <div class="item active"><div class="dot"></div>Объекты</div>
        <div class="item"><div class="dot"></div>График ТО</div>
        <div class="item"><div class="dot"></div>Отчёты</div>
        <div class="item"><div class="dot"></div>Уведомления</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ilfxyvsqintvjbifqxvr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GEl1zhHAxT_i8zU2F86cOA_-G6n7uBH";

    const badgeClass = { "ТО-1": "to1", "ТО-2": "to2", "ТО-3": "to3" };
    const months = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getDate()} ${months[d.getMonth()]}`;
    }

    function daysUntil(dateStr) {
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(dateStr); target.setHours(0,0,0,0);
      return Math.round((target - today) / 86400000);
    }

    async function loadData() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/liftkz_objects?select=*&order=next_service_date.asc`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        if (!res.ok) throw new Error("Ошибка запроса: " + res.status);
        const rows = await res.json();

        const weekCount = rows.filter(r => daysUntil(r.next_service_date) >= 0 && daysUntil(r.next_service_date) <= 7).length;
        const overdueCount = rows.filter(r => daysUntil(r.next_service_date) < 0).length;
        document.getElementById("statWeek").textContent = weekCount;
        document.getElementById("statOverdue").textContent = overdueCount;

        const list = document.getElementById("objList");
        list.innerHTML = rows.map(r => {
          const d = daysUntil(r.next_service_date);
          let tag, tagClass;
          if (d < 0) { tag = "просрочено"; tagClass = "soon"; }
          else if (d <= 7) { tag = d === 0 ? "сегодня" : `через ${d} дн.`; tagClass = "soon"; }
          else { tag = "по графику"; tagClass = "plan"; }
          const qtyText = r.quantity && r.quantity > 1 ? ` &middot; ${r.quantity} шт.` : "";
          return `
            <div class="row" style="flex-direction: column; align-items: stretch;">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div class="row-left">
                  <div class="badge ${badgeClass[r.to_level] || 'to1'}">${r.to_level || ''}</div>
                  <div>
                    <div class="row-obj">${r.client_name}${r.object_name && r.object_name !== r.client_name ? ', ' + r.object_name : ''}</div>
                    <div class="row-sub">${r.equipment_type || ''}${qtyText}</div>
                  </div>
                </div>
                <div class="row-right">
                  <div class="row-date">${formatDate(r.next_service_date)}</div>
                  <div class="row-tag ${tagClass}">${tag}</div>
                </div>
              </div>
              <button class="done-btn" onclick="markDone(${r.id}, '${r.to_level}', this)">&#10003; Отметить ТО выполнено</button>
            </div>`;
        }).join("");
      } catch (err) {
        document.getElementById("objList").innerHTML =
          `<div class="row"><div class="row-left"><div class="row-obj">Не удалось загрузить данные</div></div></div>`;
        console.error(err);
      }
    }

    const intervalDays = { "ТО-1": 30, "ТО-2": 90, "ТО-3": 365 };

    async function markDone(id, toLevel, btn) {
      btn.disabled = true;
      btn.textContent = "Сохраняю...";
      const today = new Date();
      const next = new Date(today);
      next.setDate(next.getDate() + (intervalDays[toLevel] || 30));
      const toISO = d => d.toISOString().slice(0, 10);

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/liftkz_objects?id=eq.${id}`, {
          method: "PATCH",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            Prefer: "return=minimal"
          },
          body: JSON.stringify({ last_service_date: toISO(today), next_service_date: toISO(next) })
        });
        if (!res.ok) throw new Error("Ошибка записи: " + res.status);
        await loadData();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Ошибка, повторить";
        console.error(err);
      }
    }

    loadData();
  </script>
</body>
</html>
