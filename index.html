<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лифт Кз Сервис — Приборная панель руководителя</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d1512;
    overflow: hidden;
  }
  .cover-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  .cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  a.btn {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    display: inline-block;
    background: linear-gradient(135deg, #1d3a6e, #0f2447);
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    padding: 16px 40px;
    border-radius: 32px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.45);
    white-space: nowrap;
  }
  @media (min-width: 600px) {
    .cover-wrap {
      width: 420px;
      height: 90vh;
      max-height: 880px;
      margin: 5vh auto;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
  }
</style>
</head>
<body>
  <div class="cover-wrap">
    <img class="cover" src="assets/cover.png" alt="Лифт Кз Сервис — приборная панель руководителя">
    <a class="btn" href="panel.html">Открыть Дашборд &rarr;</a>
  </div>
  <script src="pwa-install.js"></script>
</body>
</html>
