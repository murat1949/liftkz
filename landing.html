<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лифт Кз Сервис — Приборная панель руководителя</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1512;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .cover {
    width: 100%;
    border-radius: 20px;
    display: block;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .cta {
    margin-top: 22px;
  }
  a.btn {
    display: inline-block;
    background: linear-gradient(135deg, #3fb87f, #1d7a52);
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(31,122,82,0.4);
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="cover" src="assets/cover.png" alt="Лифт Кз Сервис — приборная панель руководителя">
    <div class="cta">
      <a class="btn" href="index.html">Открыть Дашборд &rarr;</a>
    </div>
  </div>
</body>
</html>
